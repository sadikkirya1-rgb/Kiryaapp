<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirya User App</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; display: block; }
    body { overflow: hidden; }
  </style>
</head>
<body>
  <iframe id="userAppFrame" src="../../index.html#user" title="Kirya User App"></iframe>
  <script>
    const userAppFrame = document.getElementById('userAppFrame');
    userAppFrame.addEventListener('load', () => {
      const appDocument = userAppFrame.contentDocument;
      if (!appDocument) return;

      appDocument.body.dataset.appRole = 'user';
    });
  </script>
</body>
</html>
